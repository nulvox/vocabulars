name: vocabular
description: A vocabulary learning app that uses images and audio to teach words in multiple languages.
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # For handling state management
  provider: ^6.1.5+1
  # For working with JSON data
  json_annotation: ^4.12.0
  # For playing audio files
  just_audio: ^0.10.6
  # For file path operations
  path: ^1.8.3
  # For localization support
  flutter_localizations:
    sdk: flutter
  # For SVG support
  flutter_svg: ^2.3.0
  # For file operations in desktop and web environments
  # Temporarily removed due to compatibility issues
  # file_picker dependency is handled via wrapper class
  # For platform detection
  universal_platform: ^1.0.0+1
  # For storing preferences (like selected language)
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # For generating JSON serialization code
  json_serializable: ^6.14.1
  build_runner: ^2.16.0
  # For linting
  flutter_lints: ^6.0.0
  # Use Flutter's built-in coverage tools instead of test_coverage

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/audio/en/automan.mp3
