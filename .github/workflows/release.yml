name: Release demo apps

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Every release tag produces one APK and one web bundle per vocabulary config.
# Audio and platform metadata are generated inside each isolated matrix job.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run zizmor
        run: nix develop --command zizmor .github/workflows

  build:
    needs: audit
    name: Build ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: house
            file: configs/house.json
          - config: bestiary
            file: configs/bestiary.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject reused or force-updated tag
        if: github.event.created != true || github.event.forced == true
        run: |
          echo "Release tags must be created once and never force-updated" >&2
          exit 1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install audio tooling
        run: python -m pip install --disable-pip-version-check requests

      - name: Derive app version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/check_release_tag.py --tag "$TAG" --write-pubspec pubspec.yaml >> "$GITHUB_OUTPUT"

      - name: Select vocabulary config
        run: python scripts/select_vocabulary.py "${{ matrix.file }}"

      - name: Generate bundled pronunciations
        run: python scripts/generate_audio.py --update-json

      - name: Generate app metadata and icon selection
        run: python scripts/generate_app_metadata.py

      - name: Validate generated content
        run: python scripts/validate_vocabulary.py --require-audio

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        env:
          BUILD_NAME: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: >-
          flutter build apk --release
          --build-name "$BUILD_NAME"
          --build-number "$BUILD_NUMBER"

      - name: Build web bundle
        run: flutter build web --release

      - name: Name release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CONFIG: ${{ matrix.config }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/vocabulars-${CONFIG}-v${VERSION}.apk"
          (cd build && zip -qr "../dist/vocabulars-${CONFIG}-v${VERSION}-web.zip" web)

      - name: Upload demo artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.config }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download demo artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Vocabulars demo apps $TAG" \
            --generate-notes
