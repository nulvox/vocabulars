name: Release demo apps

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Every release tag produces one APK and one web bundle per vocabulary config.
# Audio and platform metadata are generated inside each isolated matrix job.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true

  build:
    needs: audit
    name: Build ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: house
            file: configs/house.json
          - config: bestiary
            file: configs/bestiary.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject reused or force-updated tag
        if: github.event.created != true || github.event.forced == true
        run: |
          echo "Release tags must be created once and never force-updated" >&2
          exit 1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install audio tooling
        run: python -m pip install --disable-pip-version-check requests

      - name: Derive app version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/check_release_tag.py --tag "$TAG" --write-pubspec pubspec.yaml >> "$GITHUB_OUTPUT"

      - name: Select vocabulary config
        run: python scripts/select_vocabulary.py "${{ matrix.file }}"

      - name: Generate bundled pronunciations
        run: python scripts/generate_audio.py --update-json

      - name: Generate app metadata and icon selection
        run: python scripts/generate_app_metadata.py

      - name: Validate generated content
        run: python scripts/validate_vocabulary.py --require-audio

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        env:
          BUILD_NAME: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: >-
          flutter build apk --release
          --build-name "$BUILD_NAME"
          --build-number "$BUILD_NUMBER"

      - name: Build web bundle
        env:
          BASE_HREF: /vocabulars/${{ matrix.config }}/
        run: >-
          flutter build web --release
          --base-href "$BASE_HREF"
          --no-wasm-dry-run
          --no-tree-shake-icons

      - name: Name release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CONFIG: ${{ matrix.config }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/vocabulars-${CONFIG}-v${VERSION}.apk"
          (cd build && zip -qr "../dist/vocabulars-${CONFIG}-v${VERSION}-web.zip" web)

      - name: Upload demo artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.config }}
          path: dist/*
          if-no-files-found: error

  pages:
    name: Deploy demos to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download demo bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Vocabulars demos</title>
          <h1>Vocabulars demos</h1>
          <ul>
            <li><a href="/vocabulars/house/">Vocabulars: The House</a></li>
            <li><a href="/vocabulars/bestiary/">Vocabulars: Bestiary</a></li>
          </ul>
          HTML
          for config in house bestiary; do
            archive=$(find dist -name "vocabulars-${config}-*-web.zip" -print -quit)
            test -n "$archive"
            mkdir -p "tmp/$config" "site/$config"
            unzip -q "$archive" -d "tmp/$config"
            cp -a "tmp/$config/web/." "site/$config/"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  publish:
    name: Publish release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download demo artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Vocabulars demo apps $TAG" \
            --generate-notes
