name: Release Android APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# Never let two runs publish the same tag concurrently.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A release must be a newly-created tag. A force-updated tag is rejected
      # so an existing version can never be silently rebuilt and replaced.
      - name: Reject reused or force-updated tag
        if: github.event.created != true || github.event.forced == true
        run: |
          echo "Release tags must be created once and never force-updated" >&2
          exit 1

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.0"
          cache: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audio tooling
        run: python -m pip install --disable-pip-version-check requests

      - name: Derive app version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/check_release_tag.py --tag "$TAG" --write-pubspec pubspec.yaml >> "$GITHUB_OUTPUT"

      - name: Generate bundled pronunciations
        run: python scripts/generate_audio.py --update-json

      - name: Validate generated content
        run: python scripts/validate_vocabulary.py --require-audio

      - name: Build versioned APK
        run: >-
          flutter build apk --release
          --build-name "${{ steps.version.outputs.version }}"
          --build-number "${{ steps.version.outputs.build_number }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Do not overwrite an existing release for this immutable tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            --verify-tag \
            --title "Vocabular $VERSION" \
            --generate-notes
