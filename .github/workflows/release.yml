name: Release Android APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# A release tag is a release identity. Never cancel a running release or let
# two builds publish the same version concurrently.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate immutable version tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName > /tmp/releases.json
          nix develop --command python scripts/check_release_tag.py \
            --tag "$GITHUB_REF_NAME" \
            --existing-json /tmp/releases.json \
            --write-pubspec pubspec.yaml >> "$GITHUB_OUTPUT"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Generate bundled pronunciations
        run: nix develop --command python scripts/generate_audio.py --update-json

      - name: Validate generated content
        run: nix develop --command python scripts/validate_vocabulary.py --require-audio

      - name: Build versioned APK
        run: >-
          nix develop --command flutter build apk --release
          --build-name "${{ steps.version.outputs.version }}"
          --build-number "${{ steps.version.outputs.build_number }}"

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Do not replace or edit an existing release. Repository tag rules
          # should also reject force-updating release tags.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            --verify-tag \
            --title "Vocabular $VERSION" \
            --generate-notes
