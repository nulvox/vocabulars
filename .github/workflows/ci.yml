name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Audit workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true

  validate:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate Nix flake
        run: nix flake check --no-build

      - name: Validate vocabulary
        run: nix develop --command python scripts/validate_vocabulary.py

      - name: Validate audio generation plan
        run: nix develop --command python scripts/generate_audio.py --dry-run

      - name: Run tests
        run: nix develop --command flutter test

      - name: Analyze Dart code
        run: nix develop --command flutter analyze --no-fatal-infos

      - name: Generate app metadata
        run: nix develop --command python scripts/generate_app_metadata.py

      - name: Build web release
        run: nix develop --command flutter build web --release --no-wasm-dry-run --no-tree-shake-icons
