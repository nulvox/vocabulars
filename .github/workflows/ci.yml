name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Audit workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true

  validate:
    needs: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate Nix flake
        run: nix flake check --no-build

      - name: Validate vocabulary
        run: nix develop --command python scripts/validate_vocabulary.py

      - name: Validate audio generation plan
        run: nix develop --command python scripts/generate_audio.py --dry-run

      - name: Run tests
        run: nix develop --command flutter test

      - name: Analyze Dart code
        run: nix develop --command flutter analyze --no-fatal-infos

      - name: Generate app metadata
        run: nix develop --command python scripts/generate_app_metadata.py

      - name: Build web release
        run: nix develop --command flutter build web --release --no-wasm-dry-run --no-tree-shake-icons
